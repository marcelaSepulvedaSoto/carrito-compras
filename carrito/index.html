<!DOCTYPE html>
<!-- indicamos que usamos HTML5 -->

<html lang="es">
<!-- idioma de la página: español -->

<head>

    <!-- permite usar caracteres especiales y tildes -->
    <meta charset="UTF-8">

    <!-- hace que la página sea responsiva en celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- título que aparece en la pestaña del navegador -->
    <title>Carrito de Compras</title>

    <!-- conectamos el archivo CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- título principal de la página -->
    <h1>Carrito de Compras</h1>

    <!-- contenedor donde JavaScript agregará los productos -->
    <div id="productos"></div>

    <!-- aquí aparecerá el total final -->
    <h2 id="total"></h2>

    <!-- conectamos el archivo JavaScript -->
    <script src="carrito.js"></script>

</body>
</html>
